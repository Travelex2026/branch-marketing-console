databases:
  - name: branch-marketing-db
    plan: free
    databaseName: branch_marketing
    user: branch_marketing

services:
  - type: web
    name: branch-marketing-console
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: branch-marketing-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
