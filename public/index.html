<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<title>Branch Marketing Console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="org">Travelex / Tourvest Forex</span>
      <h1>Branch Marketing Console</h1>
    </div>
    <div class="topbar-actions">
      <div class="save-indicator" id="saveIndicator"><span class="save-dot"></span><span id="saveText">Loading…</span></div>
      <button class="topbar-link" id="exportBtn" type="button">Export backup</button>
      <button class="topbar-link" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="branches">Branches</button>
    <button class="tab-btn" data-tab="benefits">Lease Benefits</button>
    <button class="tab-btn" data-tab="calendar">Content Calendar</button>
    <button class="tab-btn" data-tab="assets">Assets Sent</button>
    <button class="tab-btn" data-tab="defaults">Standard Defaults</button>
  </nav>

  <main id="main">
    <section id="view-dashboard" class="view"></section>
    <section id="view-branches" class="view" hidden></section>
    <section id="view-benefits" class="view" hidden></section>
    <section id="view-calendar" class="view" hidden></section>
    <section id="view-assets" class="view" hidden></section>
    <section id="view-defaults" class="view" hidden></section>
  </main>

  <footer class="hint">Branch Marketing Console — a private working tool for Travelex / Tourvest Forex branch marketing. Changes save automatically.</footer>
</div>

<datalist id="branchNamesList"></datalist>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/app.js"></script>
</body>
</html>
